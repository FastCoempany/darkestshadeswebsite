name: wall

# The drawer wall's checks (wall/, DRAWER-WALL.md D1): npm run all without the pixel comparisons. The photographs'
# zoom set (wall/public/zoom/, git-ignored) is built here first from the committed stage masters in dam/product/, as it
# is on a developer's machine by npm run assets: without it the view offers no photographs and the flows that press
# "See the photographs" cannot run.
on:
  push:
    branches: [main, 'wall/**']
    paths: ['wall/**', 'design/tokens/**', 'content/**', 'dam/product/**', 'assets/photography/MANIFEST.csv', 'tools/photo/zoom_export.py', '.github/workflows/wall.yml']
  pull_request:
    paths: ['wall/**', 'design/tokens/**', 'content/**', 'dam/product/**', 'assets/photography/MANIFEST.csv', 'tools/photo/zoom_export.py', '.github/workflows/wall.yml']

jobs:
  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: wall
    env:
      CI: 1
      WALL_NO_PIXELS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wall/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pillow==12.3.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run assets -- --strict   # the 32 photographs, or the step fails
      - run: npm run test
      - run: npm run build
      - run: npm run check
      - run: npm run budget
      - run: npm run test:e2e
      - run: CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npm run lighthouse   # the Playwright Chromium this workflow installed, as checks/lighthouse.mjs expects; never the image's own Chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-test-results
          path: |
            wall/test-results
            wall/playwright-report
          if-no-files-found: ignore
